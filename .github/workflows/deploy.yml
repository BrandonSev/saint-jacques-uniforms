name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/brandonsev/saint-jacques-uniforms

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Coolify ne fait plus que pull l'image + redémarrer le conteneur.
      - name: Déclencher le déploiement Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Retire espaces/retours à la ligne collés par erreur dans les secrets.
          url="$(echo -n "$COOLIFY_WEBHOOK" | tr -d '[:space:]')"
          token="$(echo -n "$COOLIFY_TOKEN" | tr -d '[:space:]')"
          token="${token#Bearer}"
          code=$(curl -sS -o response.txt -w '%{http_code}' --retry 3 \
            -H "Authorization: Bearer $token" "$url")
          echo "HTTP $code"
          cat response.txt; echo
          [ "$code" -lt 400 ]
